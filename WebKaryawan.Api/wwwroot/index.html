<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi Data Pribadi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/aplikasi.css" />
</head>
<body>
    <div class="container-fluid py-3">

        <div class="kepala-aplikasi d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center gap-2">
                <span class="ikon-daftar">&#9776;</span>
                <h1 class="judul-aplikasi mb-0">Aplikasi Data Pribadi</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="teks-sesi">Masuk sebagai <strong id="namaPengguna">-</strong></span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="tombolKeluar">Keluar</button>
            </div>
        </div>

        <div class="panel-cari p-3 mb-3">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="inputCariNik" class="form-label label-cari">NIK</label>
                    <input type="text" class="form-control" id="inputCariNik" autocomplete="off" />
                </div>
                <div class="col-md-4">
                    <label for="inputCariNama" class="form-label label-cari">Nama</label>
                    <input type="text" class="form-control" id="inputCariNama" autocomplete="off" />
                </div>
                <div class="col-md-5 d-flex justify-content-end gap-2">
                    <button type="button" class="btn tombol-utama" id="tombolCari">Cari</button>
                    <button type="button" class="btn tombol-utama" id="tombolReset">Reset</button>
                    <button type="button" class="btn tombol-utama" id="tombolTambah">Tambah</button>
                </div>
            </div>
        </div>

        <div class="tabel-pembungkus">
            <table class="table tabel-data mb-0">
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">NIK</th>
                        <th scope="col">Nama Lengkap</th>
                        <th scope="col">Umur</th>
                        <th scope="col">Tanggal Lahir</th>
                        <th scope="col">Jenis Kelamin</th>
                        <th scope="col">Alamat</th>
                        <th scope="col">Negara</th>
                        <th scope="col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="badanTabel"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div class="teks-info" id="infoBaris">-</div>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="navigasiHalaman"></ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="modalHapus" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <p class="mb-0" id="teksKonfirmasiHapus">Anda yakin menghapus data ini ?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn tombol-utama" id="tombolOke">Oke</button>
                    <button type="button" class="btn tombol-kedua" data-bs-dismiss="modal">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Data Pribadi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body" id="isiDetail"></div>
                <div class="modal-footer">
                    <button type="button" class="btn tombol-kedua" data-bs-dismiss="modal">Kembali</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/aplikasi.js"></script>
</body>
</html>
