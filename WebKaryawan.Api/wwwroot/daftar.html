<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daftar - Aplikasi Data Pribadi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/aplikasi.css" />
</head>
<body class="halaman-login">
    <div class="kartu-login">
        <h1 class="judul-form mb-1">Daftar Akun</h1>
        <p class="teks-info mb-4">Akun baru hanya dapat melihat data. Perubahan data perlu hak Admin.</p>

        <div class="alert alert-danger py-2" id="kotakGalat" style="display:none;"></div>

        <form id="formDaftar" novalidate>
            <div class="mb-3">
                <label for="inputUsername" class="form-label">Nama Pengguna</label>
                <input type="text" class="form-control" id="inputUsername" autocomplete="username" required />
                <div class="pesan-galat" data-untuk="username"></div>
            </div>
            <div class="mb-3">
                <label for="inputPassword" class="form-label">Kata Sandi</label>
                <input type="password" class="form-control" id="inputPassword" autocomplete="new-password" required />
                <div class="pesan-galat" data-untuk="password"></div>
            </div>
            <div class="mb-3">
                <label for="inputUlangPassword" class="form-label">Ulangi Kata Sandi</label>
                <input type="password" class="form-control" id="inputUlangPassword" autocomplete="new-password" required />
                <div class="pesan-galat" data-untuk="ulangiPassword"></div>
            </div>
            <button type="submit" class="btn tombol-utama w-100">Daftar</button>
        </form>

        <p class="teks-info mt-3 mb-0">Sudah punya akun? <a href="/login.html">Masuk di sini</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
        $(function () {
            var pesanGalat = {
                USERNAME_DIPAKAI: 'Nama pengguna sudah dipakai.',
                PASSWORD_TERLALU_PENDEK: 'Kata sandi minimal 8 karakter.',
                PASSWORD_HARUS_ADA_ANGKA: 'Kata sandi harus ada angka.',
                PASSWORD_HARUS_ADA_SIMBOL: 'Kata sandi harus ada simbol.',
                PASSWORD_HARUS_ADA_HURUF_BESAR: 'Kata sandi harus ada huruf besar.',
                PASSWORD_HARUS_ADA_HURUF_KECIL: 'Kata sandi harus ada huruf kecil.',
                AKUN_TIDAK_VALID: 'Data akun tidak valid.'
            };

            var petaField = {
                USERNAME_DIPAKAI: 'username',
                PASSWORD_TERLALU_PENDEK: 'password',
                PASSWORD_HARUS_ADA_ANGKA: 'password',
                PASSWORD_HARUS_ADA_SIMBOL: 'password',
                PASSWORD_HARUS_ADA_HURUF_BESAR: 'password',
                PASSWORD_HARUS_ADA_HURUF_KECIL: 'password'
            };

            $('#formDaftar').on('submit', function (peristiwa) {
                peristiwa.preventDefault();
                $('#kotakGalat').hide();
                $('.pesan-galat').text('');

                var password = $('#inputPassword').val();
                var ulangiPassword = $('#inputUlangPassword').val();

                if (password !== ulangiPassword) {
                    $('.pesan-galat[data-untuk="ulangiPassword"]').text('Kata sandi tidak sama.');
                    return;
                }

                $.ajax({
                    url: '/api/auth/daftar',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: $('#inputUsername').val().trim(),
                        password: password
                    })
                }).then(function () {
                    window.location.href = '/login.html';
                }, function (xhr) {
                    if (xhr.status !== 400) {
                        $('#kotakGalat').text('Gagal mendaftar. Coba lagi.').show();
                        return;
                    }

                    var isi = xhr.responseJSON || {};
                    var daftarGalat = isi.galat || [];

                    if (!daftarGalat.length) {
                        $('#kotakGalat').text('Data akun tidak valid.').show();
                        return;
                    }

                    daftarGalat.forEach(function (galat) {
                        var pesan = pesanGalat[galat.kode] || galat.pesan;
                        var namaField = petaField[galat.kode];
                        if (namaField) {
                            $('.pesan-galat[data-untuk="' + namaField + '"]').text(pesan);
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
