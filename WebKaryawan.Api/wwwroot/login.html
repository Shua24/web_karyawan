<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk - Aplikasi Data Pribadi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/aplikasi.css" />
</head>
<body class="halaman-login">
    <div class="kartu-login">
        <h1 class="judul-form mb-1">Aplikasi Data Pribadi</h1>
        <p class="teks-info mb-4">Masuk untuk mengelola data pribadi.</p>

        <div class="alert alert-danger py-2 ringkasan-galat tampil" id="kotakGalat" style="display:none;"></div>

        <form id="formMasuk" novalidate>
            <div class="mb-3">
                <label for="inputUsername" class="form-label">Nama Pengguna</label>
                <input type="text" class="form-control" id="inputUsername" autocomplete="username" required />
                <div class="pesan-galat" data-untuk="username"></div>
            </div>
            <div class="mb-3">
                <label for="inputPassword" class="form-label">Kata Sandi</label>
                <input type="password" class="form-control" id="inputPassword" autocomplete="current-password" required />
                <div class="pesan-galat" data-untuk="password"></div>
            </div>
            <button type="submit" class="btn tombol-utama w-100">Masuk</button>
        </form>

        <p class="teks-info mt-3 mb-0">Belum punya akun? <a href="/daftar.html">Daftar di sini</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
        $(function () {
            $('#formMasuk').on('submit', function (peristiwa) {
                peristiwa.preventDefault();
                $('#kotakGalat').hide();
                $('.pesan-galat').text('');

                $.ajax({
                    url: '/api/auth/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: $('#inputUsername').val().trim(),
                        password: $('#inputPassword').val()
                    })
                }).then(function () {
                    window.location.href = '/index.html';
                }, function (xhr) {
                    if (xhr.status === 401) {
                        $('#kotakGalat').text('Nama pengguna atau kata sandi salah.').show();
                    } else {
                        $('#kotakGalat').text('Gagal masuk. Coba lagi.').show();
                    }
                });
            });
        });
    </script>
</body>
</html>
